<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GautomateD</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="create.css">
</head>
<body class="login-bg">

    <header class="login-header">
        <a href="index.html" class="back-home-btn">
            <span>&larr;</span> Back to Home
        </a>
        <h1 class="top-title">Join Us</h1>
        <div class="empty-space"></div>
    </header>

    <main class="login-container">
        <div class="login-box">
            <h2>Create Account</h2>
            <form class="auth-form">
                <div class="input-group">
                    <input type="text" required placeholder="Full Name">
                </div>
                <div class="input-group">
                    <input type="email" required placeholder="Email Address">
                </div>
                <div class="input-group">
                    <input type="password" required placeholder="Create Password">
                </div>
                
                <p class="signup-link">already existing user ? , <a href="signup.html">sign up</a></p>
                
                <button type="submit" class="login-submit">Register Now</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 GautomateD. All rights reserved.</p>
    </footer>

</body>
</html>
